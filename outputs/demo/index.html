<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Meeting Cost Calculator</title>
<style>
  :root {
    --bg: #12141a;
    --panel: #1b1e26;
    --panel-2: #22262f;
    --border: #2f343f;
    --text: #e8eaef;
    --muted: #9aa2b1;
    --accent: #ff7a1a;
    --accent-soft: rgba(255, 122, 26, 0.14);
    --danger: #ff6b6b;
    --ok: #4ade80;
    --radius: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background:
      radial-gradient(1100px 620px at 82% -12%, rgba(255, 122, 26, 0.10), transparent 62%),
      radial-gradient(900px 520px at 4% 106%, rgba(255, 122, 26, 0.06), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(16px, 4vw, 40px) clamp(14px, 4vw, 32px);
  }

  .wrap {
    width: 100%;
    max-width: 760px;
    margin: auto;
  }

  header { margin-bottom: 22px; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid rgba(255, 122, 26, 0.32);
    border-radius: 999px;
    padding: 5px 12px;
  }

  h1 {
    font-size: clamp(26px, 5.2vw, 38px);
    line-height: 1.15;
    margin: 14px 0 6px;
    letter-spacing: -0.02em;
  }

  .sub {
    margin: 0;
    color: var(--muted);
    font-size: clamp(14px, 2.4vw, 16px);
  }

  .card {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: clamp(16px, 3.4vw, 26px);
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.42);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 16px;
  }

  .field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }

  label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.01em;
  }

  .hint {
    font-size: 12px;
    color: var(--muted);
    font-weight: 400;
  }

  input[type="text"] {
    width: 100%;
    background: #14161c;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 11px 13px;
    font: inherit;
    font-variant-numeric: tabular-nums;
    transition: border-color 120ms ease, box-shadow 120ms ease;
  }

  input[type="text"]::placeholder { color: #8b93a3; }

  input[type="text"]:hover { border-color: #3c4250; }

  input[type="text"]:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255, 122, 26, 0.25);
  }

  input[aria-invalid="true"] {
    border-color: var(--danger);
    box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.18);
  }

  .err {
    color: var(--danger);
    font-size: 12.5px;
    font-weight: 600;
  }

  .err:empty { display: none; }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
  }

  button {
    font: inherit;
    font-weight: 600;
    border-radius: 9px;
    padding: 10px 18px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: #23272f;
    color: var(--text);
    transition: background 120ms ease, border-color 120ms ease, transform 80ms ease;
  }

  button:hover { background: #2b3039; }

  button:active { transform: translateY(1px); }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a1205;
  }

  .primary:hover { background: #ff8c3d; }

  .result {
    margin-top: 22px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #14161c;
    padding: clamp(16px, 3.4vw, 24px);
    text-align: center;
  }

  .result .label {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }

  .amount {
    font-size: clamp(38px, 10vw, 60px);
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    margin: 6px 0 4px;
    overflow-wrap: anywhere;
  }

  .formula {
    color: var(--muted);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }

  .status {
    margin-top: 10px;
    font-size: 13px;
    color: var(--danger);
    font-weight: 600;
  }

  .status:empty { display: none; }

  .status.ok { color: var(--ok); }

  .breakdown {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    text-align: left;
  }

  .breakdown div {
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 10px 12px;
    background: #171a20;
  }

  .breakdown dt {
    font-size: 11.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }

  .breakdown dd {
    margin: 3px 0 0;
    font-size: 16px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  footer {
    margin-top: 20px;
    color: #8b93a3;
    font-size: 12px;
    text-align: center;
  }

  @media (max-width: 480px) {
    .actions button { flex: 1 1 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Offline tool</span>
    <h1>Meeting Cost Calculator</h1>
    <p class="sub">Estimate the loaded cost of a meeting: attendees &times; duration &times; hourly rate.</p>
  </header>

  <main class="card">
    <form id="calc-form" novalidate>
      <div class="grid">
        <div class="field">
          <label for="attendees">Attendees <span class="hint">(whole number, at least 1)</span></label>
          <input id="attendees" name="attendees" type="text" inputmode="numeric" pattern="[0-9]*"
                 autocomplete="off" spellcheck="false" value="4" aria-describedby="attendees-err">
          <p class="err" id="attendees-err" role="alert"></p>
        </div>

        <div class="field">
          <label for="minutes">Duration <span class="hint">(minutes)</span></label>
          <input id="minutes" name="minutes" type="text" inputmode="decimal"
                 autocomplete="off" spellcheck="false" value="30" aria-describedby="minutes-err">
          <p class="err" id="minutes-err" role="alert"></p>
        </div>

        <div class="field">
          <label for="rate">Hourly rate <span class="hint">(CAD)</span></label>
          <input id="rate" name="rate" type="text" inputmode="decimal"
                 autocomplete="off" spellcheck="false" value="150" aria-describedby="rate-err">
          <p class="err" id="rate-err" role="alert"></p>
        </div>
      </div>

      <div class="actions">
        <button type="button" id="reset-btn">Reset to defaults</button>
      </div>
    </form>

    <section class="result" aria-labelledby="result-label">
      <div class="label" id="result-label">Estimated meeting cost</div>
      <div class="amount" id="amount" role="status" aria-live="polite">$300.00</div>
      <div class="formula" id="formula">4 attendees &times; 30 min &divide; 60 &times; $150.00/h</div>
      <p class="status" id="status" role="status" aria-live="polite"></p>

      <dl class="breakdown">
        <div><dt>People</dt><dd id="b-people">4</dd></div>
        <div><dt>Hours</dt><dd id="b-hours">0.50</dd></div>
        <div><dt>Cost / person</dt><dd id="b-per">$75.00</dd></div>
      </dl>
    </section>
  </main>

  <footer>Runs entirely in your browser &mdash; no data leaves this page.</footer>
</div>

<script>
(function () {
  "use strict";

  var CAD = {
    // Format a finite number as CAD with two decimals. Returns null for invalid input.
    format: function (value) {
      if (typeof value !== "number" || !isFinite(value)) { return null; }
      return new Intl.NumberFormat("en-CA", { style: "currency", currency: "CAD", currencyDisplay: "narrowSymbol", minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(value);
    },
    // Format a plain number with up to 2 decimals, trimming trailing zeros.
    formatNumber: function (value) {
      if (typeof value !== "number" || !isFinite(value)) { return null; }
      return String(Math.round(value * 100) / 100);
    }
  };

  // --- Pure validation -------------------------------------------------
  // Each validator returns { ok: true, value } or { ok: false, message }.
  // A shared numeric guard keeps every field consistent.
  var NUMERIC = /^[+-]?(\d+\.?\d*|\.\d+)$/;

  function readNumber(raw) {
    // Returns { ok: true, value } or { ok: false, reason: 'empty' | 'not-number' | 'not-finite' }.
    var text = raw === null || raw === undefined ? "" : String(raw).trim();
    if (text === "") { return { ok: false, reason: "empty" }; }
    if (!NUMERIC.test(text)) { return { ok: false, reason: "not-number" }; }
    var n = Number(text);
    if (!isFinite(n)) { return { ok: false, reason: "not-finite" }; }
    return { ok: true, value: n };
  }

  var validators = {
    attendees: function (raw) {
      var parsed = readNumber(raw);
      if (!parsed.ok) {
        if (parsed.reason === "empty") {
          return { ok: false, message: "Enter the number of attendees." };
        }
        if (parsed.reason === "not-finite") {
          return { ok: false, message: "Attendees must be a finite number." };
        }
        return { ok: false, message: "Attendees must be a number." };
      }
      var n = parsed.value;
      if (n < 1) {
        return { ok: false, message: "Attendees must be at least 1." };
      }
      if (Math.floor(n) !== n) {
        return { ok: false, message: "Attendees must be a whole number." };
      }
      return { ok: true, value: n };
    },

    minutes: function (raw) {
      var parsed = readNumber(raw);
      if (!parsed.ok) {
        if (parsed.reason === "empty") {
          return { ok: false, message: "Enter the duration in minutes." };
        }
        if (parsed.reason === "not-finite") {
          return { ok: false, message: "Duration must be a finite number." };
        }
        return { ok: false, message: "Duration must be a number." };
      }
      var n = parsed.value;
      if (n < 0) {
        return { ok: false, message: "Duration cannot be negative." };
      }
      return { ok: true, value: n };
    },

    rate: function (raw) {
      var parsed = readNumber(raw);
      if (!parsed.ok) {
        if (parsed.reason === "empty") {
          return { ok: false, message: "Enter the hourly rate." };
        }
        if (parsed.reason === "not-finite") {
          return { ok: false, message: "Hourly rate must be a finite number." };
        }
        return { ok: false, message: "Hourly rate must be a number." };
      }
      var n = parsed.value;
      if (n < 0) {
        return { ok: false, message: "Hourly rate cannot be negative." };
      }
      return { ok: true, value: n };
    }
  };

  // --- Pure calculation ------------------------------------------------
  // cost = attendees * minutes / 60 * rate ; returns null when not computable.
  function calculateCost(attendees, minutes, rate) {
    if (
      typeof attendees !== "number" || !isFinite(attendees) ||
      typeof minutes !== "number" || !isFinite(minutes) ||
      typeof rate !== "number" || !isFinite(rate)
    ) {
      return null;
    }
    var cost = attendees * minutes / 60 * rate;
    if (!isFinite(cost)) { return null; }
    return cost;
  }

  // --- DOM wiring ------------------------------------------------------
  var form = document.getElementById("calc-form");
  var fields = {
    attendees: {
      input: document.getElementById("attendees"),
      error: document.getElementById("attendees-err")
    },
    minutes: {
      input: document.getElementById("minutes"),
      error: document.getElementById("minutes-err")
    },
    rate: {
      input: document.getElementById("rate"),
      error: document.getElementById("rate-err")
    }
  };

  var els = {
    amount: document.getElementById("amount"),
    formula: document.getElementById("formula"),
    status: document.getElementById("status"),
    people: document.getElementById("b-people"),
    hours: document.getElementById("b-hours"),
    per: document.getElementById("b-per"),
    reset: document.getElementById("reset-btn")
  };

  var DEFAULTS = { attendees: 4, minutes: 30, rate: 150 };
  var PLACEHOLDER = "—";

  function setFieldError(key, message) {
    var f = fields[key];
    f.error.textContent = message || "";
    if (message) {
      f.input.setAttribute("aria-invalid", "true");
    } else {
      f.input.removeAttribute("aria-invalid");
    }
  }

  function clearErrors() {
    Object.keys(fields).forEach(function (key) { setFieldError(key, ""); });
  }

  function setStatus(message, ok) {
    els.status.textContent = message || "";
    els.status.className = message ? (ok ? "status ok" : "status") : "status";
  }

  function showInvalid() {
    // Never display NaN or a stale amount on invalid input.
    els.amount.textContent = PLACEHOLDER;
    els.formula.textContent = "Fix the highlighted field to see an estimate.";
    els.people.textContent = PLACEHOLDER;
    els.hours.textContent = PLACEHOLDER;
    els.per.textContent = PLACEHOLDER;
    setStatus("Enter valid values to calculate the cost.", false);
  }

  function update() {
    var values = {};
    var valid = true;
    var firstInvalid = null;

    Object.keys(fields).forEach(function (key) {
      var raw = fields[key].input.value;
      var result = validators[key](raw);
      if (result.ok) {
        setFieldError(key, "");
        values[key] = result.value;
      } else {
        valid = false;
        setFieldError(key, result.message);
        if (!firstInvalid) { firstInvalid = key; }
      }
    });

    if (!valid) {
      showInvalid();
      return { valid: false, firstInvalid: firstInvalid, values: values };
    }

    var cost = calculateCost(values.attendees, values.minutes, values.rate);
    var formatted = CAD.format(cost);
    if (formatted === null) {
      showInvalid();
      els.formula.textContent = "These values are too large to calculate.";
      setStatus("Use smaller values and try again.", false);
      return { valid: false, firstInvalid: firstInvalid, values: values };
    }

    els.amount.textContent = formatted;
    els.formula.textContent =
      values.attendees + " attendee" + (values.attendees === 1 ? "" : "s") +
      " × " + CAD.formatNumber(values.minutes) + " min ÷ 60 × " +
      CAD.format(values.rate) + "/h";
    els.people.textContent = String(values.attendees);
    els.hours.textContent = CAD.formatNumber(values.minutes / 60);
    els.per.textContent = CAD.format(values.rate * values.minutes / 60);
    setStatus("Estimated cost for " + CAD.formatNumber(values.minutes) + " minutes.", true);

    return { valid: true, firstInvalid: null, values: values, cost: cost };
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var outcome = update();
    if (!outcome.valid && outcome.firstInvalid) {
      fields[outcome.firstInvalid].input.focus();
    }
  });

  Object.keys(fields).forEach(function (key) {
    fields[key].input.addEventListener("input", update);
    fields[key].input.addEventListener("blur", function () {
      var result = validators[key](fields[key].input.value);
      setFieldError(key, result.ok ? "" : result.message);
    });
  });

  els.reset.addEventListener("click", function () {
    fields.attendees.input.value = String(DEFAULTS.attendees);
    fields.minutes.input.value = String(DEFAULTS.minutes);
    fields.rate.input.value = String(DEFAULTS.rate);
    clearErrors();
    update();
    fields.attendees.input.focus();
  });

  // Expose the pure pieces for the test suite.
  window.MeetingCost = {
    calculateCost: calculateCost,
    validators: validators,
    format: CAD.format,
    formatNumber: CAD.formatNumber,
    defaults: DEFAULTS,
    update: update
  };

  // Initial paint (defaults -> $300.00)
  update();
}());
</script>
</body>
</html>
